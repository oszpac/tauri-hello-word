name: "Publish Tauri App"

# 触发条件：手动触发 或 推送到 release 分支
on:
  workflow_dispatch:
  push:
    branches:
      - release

#  关键修复：并发控制
# 防止同时运行多次导致创建多个 Draft
concurrency:
  group: "publish-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows 构建
          - platform: "windows-latest"
            args: ""
          # 2. macOS ARM (M1/M2/M3) - 使用最新版 runner (默认 ARM)
          - platform: "macos-latest"
            args: ""
          # 3. macOS Intel (x86_64) - 使用 macos-13 (Intel 架构 runner)
          # 这是官方推荐做法，避免交叉编译问题
          - platform: "macos-13"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      # 1. 检出代码
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      # 3. 设置 Rust
      - name: 🦀 Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 4. Rust 缓存 (加速构建)
      - name: 🗃️ Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # 5. 安装前端依赖
      - name: 📦 Install frontend dependencies
        run: npm ci

      # 6. 构建前端 (Vite)
      - name: 🔨 Build frontend
        run: npm run build

      # 7. 构建 Tauri 应用并发布
      - name: Build & Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Release v__VERSION__"
          releaseBody: |
            🎉 **Tauri + Vue App**

            **📦 包含以下安装包：**
            - 🪟 Windows: `setup.exe` / `.msi`
            -  macOS (Apple Silicon): `.dmg`
            - 🍎 macOS (Intel): `.dmg`

            > 提示：macOS 用户如果提示“已损坏”，请终端执行 `xattr -cr /Applications/YourApp.app`
          releaseDraft: true # 🔥 保持为草稿，确认无误后手动发布
          prerelease: false
          args: ${{ matrix.args }}
