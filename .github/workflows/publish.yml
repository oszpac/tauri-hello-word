name: "Auto Publish Tauri App"

#  触发条件：推送 Tag 时自动执行（如 v1.0.0, v0.2.1）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # 保留手动触发备用

# 防止并发冲突
concurrency:
  group: "publish-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "macos-latest" # Apple Silicon (M1/M2/M3)
            args: ""
          - platform: "macos-13" # Intel 芯片
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🗃️ Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 📦 Install deps
        run: npm ci

      - name: 🔨 Build frontend
        run: npm run build

      - name: Build & Auto Publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Release v__VERSION__"
          releaseBody: |
            🎉 自动构建发布 | Auto Build & Publish

            **📦 安装包列表**
            - 🪟 Windows: `setup.exe` / `.msi`
            - 🍎 macOS (Apple Silicon): `.dmg`
            - 🍎 macOS (Intel): `.dmg`

            > 💡 macOS 提示“已损坏”？终端执行：`xattr -cr /Applications/Hello\ Word.app`
          releaseDraft: false # 🔥 关键：自动直接发布，不存草稿
          prerelease: false
          args: ${{ matrix.args }}
